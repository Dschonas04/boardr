services:
  boardr:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BOARDR_DB: postgres://boardr:${DB_KENNWORT}@db:5432/boardr?sslmode=disable
    ports:
      - "8390:8390"
    volumes:
      - einstellungen:/einstellungen
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardr
      POSTGRES_PASSWORD: ${DB_KENNWORT}
      POSTGRES_DB: boardr
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardr -d boardr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
  einstellungen:
